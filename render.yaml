# Render Blueprint for the Accora API (New > Blueprint > this repository).
# FREE plan: no persistent disk, so the SQLite database and uploaded documents
# are EPHEMERAL — wiped on every deploy or restart. Fine for a demo. For real
# data, switch plan to starter and add a disk mounted at /var/data (see git
# history for that variant), pointing DATABASE_PATH/UPLOAD_DIR at it.
services:
  - type: web
    name: accora-backend
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_PATH
        value: data/accora.sqlite
      - key: UPLOAD_DIR
        value: uploads
      # 64 MiB per password hash keeps concurrent logins within 512 MB of memory.
      - key: SCRYPT_COST
        value: "65536"
      - key: LOG_LEVEL
        value: info
      # The frontend origin(s), e.g. https://accora.vercel.app (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # --- Google Document AI (optional) ---
      # Leave AI_PROVIDER empty to run without document reading. To enable, set
      # it to google_document_ai and fill the rest in the Render dashboard.
      # There is no disk for a key file on deploy: paste the service-account
      # key JSON (the whole file content) into GOOGLE_APPLICATION_CREDENTIALS_JSON.
      - key: AI_PROVIDER
        value: ""
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: DOCUMENT_AI_LOCATION
        value: us
      - key: DOCUMENT_AI_INVOICE_PROCESSOR_ID
        sync: false
      - key: DOCUMENT_AI_EXPENSE_PROCESSOR_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
